<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hello from deskhatch</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font:18px/1.5 -apple-system,"Segoe UI",Inter,sans-serif; background:#111; color:#eee; }
  .card { text-align:center; max-width:460px; padding:32px; }
  code { background:#222; padding:2px 8px; border-radius:6px; }
  button { font:inherit; padding:8px 16px; border-radius:10px; border:0; background:#f97316; color:#111; cursor:pointer; margin-top:12px; }
</style></head>
<body><div class="card">
  <h1>It is a real app now.</h1>
  <p>This page was a single HTML file. <code>deskhatch install hello.html</code> gave it a window, an icon and a place in your Applications.</p>
  <p id="info"></p>
  <button onclick="hatch.about()">About this app</button>
</div>
<script>hatch.ready.then(i => { if (i) document.getElementById('info').textContent = `Running on ${i.platform} with permissions "${i.permissions}", model ${i.llm.provider}/${i.llm.model}.`; });</script>
</body></html>
