name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_SECRETS: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Version from tag
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: Prepare Apple signing (only when secrets are present)
        if: runner.os == 'macOS' && env.HAS_APPLE_SECRETS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          echo "signing=1" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build with Tauri
        working-directory: runtime
        shell: bash
        env:
          # Code signing: tauri-cli imports APPLE_CERTIFICATE (base64 .p12) into a temporary keychain.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization via App Store Connect API key (APPLE_API_KEY_PATH is set above).
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} ${{ runner.os == 'Linux' && '--bundles appimage,deb' || '--bundles app' }}

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          V="${{ steps.v.outputs.version }}"
          B="runtime/target/${{ matrix.target }}/release/bundle"
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -C "$B/macos" -czf "dist/deskhatch-v${V}-${{ matrix.asset }}.tar.gz" Deskhatch.app
          else
            cp "$B"/appimage/*.AppImage "dist/deskhatch-v${V}-${{ matrix.asset }}.AppImage"
            cp "$B"/deb/*.deb "dist/deskhatch-v${V}-${{ matrix.asset }}.deb"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
