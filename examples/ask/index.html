<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask</title>
<style>
  :root { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --me:#dbeafe; --ai:#ffffff; --line:#e2e8f0; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --fg:#e2e8f0; --muted:#94a3b8; --me:#1e3a8a; --ai:#111a2e; --line:#1f2a44; --accent:#60a5fa; } }
  * { box-sizing:border-box } html,body { margin:0; height:100% }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,"Segoe UI",Inter,Roboto,sans-serif; display:grid; grid-template-rows:auto 1fr auto; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted); }
  header b { color:var(--fg) } header .sp { flex:1 }
  header button { font:inherit; font-size:12px; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:8px; padding:4px 9px; cursor:pointer; }
  main { overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:var(--ai); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .err { align-self:stretch; color:#b91c1c; font-size:13px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--bg); }
  textarea { flex:1; font:inherit; resize:none; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--ai); color:var(--fg); min-height:44px; max-height:160px; }
  button.send { font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 18px; cursor:pointer; }
  button.send:disabled { opacity:.5 }
  .empty { margin:auto; text-align:center; color:var(--muted); max-width:380px; }
  .empty code { background:var(--ai); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
</style>
</head>
<body>
  <header><span>Model:</span><b id="model">…</b><span class="sp"></span><button id="clear">Clear</button></header>
  <main id="log"><div class="empty" id="empty">Ask anything. This talks to <code id="prov">your model</code> through deskhatch.<br><br>No model yet? Install <code>ollama</code>, run <code>ollama pull qwen2.5-coder:7b</code>, done.</div></main>
  <form id="f"><textarea id="q" placeholder="Message… (Enter to send, Shift+Enter for a new line)"></textarea><button class="send" id="send">Send</button></form>
<script>
  const $ = (s) => document.querySelector(s);
  let history = [];
  function add(role, text) {
    $('#empty')?.remove();
    const d = document.createElement('div'); d.className = 'msg ' + (role === 'user' ? 'me' : role === 'error' ? 'err' : 'ai'); d.textContent = text;
    $('#log').appendChild(d); $('#log').scrollTop = 1e9; return d;
  }
  async function send() {
    const q = $('#q').value.trim(); if (!q) return;
    $('#q').value = ''; add('user', q); history.push({ role: 'user', content: q });
    $('#send').disabled = true; const pending = add('assistant', '…');
    try {
      const a = await hatch.llm.chat(history.slice(-20));
      pending.textContent = a; history.push({ role: 'assistant', content: a });
      await hatch.store.set('history', history);
    } catch (e) { pending.remove(); add('error', String(e)); }
    finally { $('#send').disabled = false; $('#q').focus(); }
  }
  $('#f').onsubmit = (e) => { e.preventDefault(); send(); };
  $('#q').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  $('#clear').onclick = async () => { history = []; await hatch.store.set('history', null); $('#log').innerHTML = ''; };
  (async () => {
    const info = await hatch.ready;
    if (info) { $('#model').textContent = `${info.llm.provider} / ${info.llm.model}`; $('#prov').textContent = info.llm.endpoint; }
    history = (await hatch.store.get('history')) || [];
    for (const m of history) add(m.role, m.content);
    $('#q').focus();
  })();
</script>
</body>
</html>
